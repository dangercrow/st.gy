<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A Gift for st.gy</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-1: #160f2d;
        --bg-2: #3b174a;
        --bg-3: #ff8fb7;
        --cream: #fff3d6;
        --frosting: #ffb9d0;
        --cake: #f7a8a8;
        --cake-dark: #c86f88;
        --plate: #e9f8ff;
        --text: #fff9ed;
        --muted: #f7d7e8;
        --flame: #ffdc69;
        --flame-core: #fff7b0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 15% 15%, rgba(255, 226, 145, 0.32), transparent 22rem),
          radial-gradient(circle at 85% 10%, rgba(139, 231, 255, 0.26), transparent 20rem),
          linear-gradient(145deg, var(--bg-1), var(--bg-2) 48%, #70295c 100%);
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      body::before {
        background-image:
          radial-gradient(circle, rgba(255, 255, 255, 0.45) 0 0.12rem, transparent 0.14rem),
          radial-gradient(circle, rgba(255, 220, 105, 0.38) 0 0.1rem, transparent 0.12rem);
        background-position: 0 0, 2.5rem 3.5rem;
        background-size: 5.5rem 5.5rem, 7rem 7rem;
        opacity: 0.55;
      }

      body::after {
        background: linear-gradient(transparent 0 72%, rgba(18, 8, 31, 0.34));
      }

      main {
        width: min(92vw, 52rem);
        padding: clamp(1.5rem, 4vw, 3rem);
        text-align: center;
        position: relative;
        z-index: 1;
      }

      .gift-card {
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 2rem;
        padding: clamp(1.5rem, 5vw, 3rem);
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 2rem 5rem rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(18px);
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: var(--muted);
        font-size: clamp(0.8rem, 2vw, 0.95rem);
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 11vw, 6rem);
        line-height: 0.9;
        letter-spacing: -0.08em;
        text-wrap: balance;
      }

      .intro {
        max-width: 35rem;
        margin: 1.1rem auto 2.25rem;
        color: var(--muted);
        font-size: clamp(1rem, 2.5vw, 1.2rem);
        line-height: 1.65;
      }

      .stage {
        min-height: 21rem;
        display: grid;
        place-items: end center;
        padding-top: 2.5rem;
        position: relative;
      }

      .message {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translate(-50%, 0.8rem) scale(0.9);
        margin: 0;
        opacity: 0;
        color: #fff3a8;
        font-size: clamp(2rem, 8vw, 5rem);
        font-weight: 950;
        letter-spacing: -0.05em;
        text-shadow: 0 0.25rem 1rem rgba(104, 31, 71, 0.55);
        transition: opacity 700ms ease, transform 700ms cubic-bezier(0.18, 0.89, 0.32, 1.28);
        pointer-events: none;
      }

      .cake {
        width: min(76vw, 27rem);
        height: 16.5rem;
        position: relative;
        filter: drop-shadow(0 1.2rem 1.8rem rgba(0, 0, 0, 0.28));
        transition: transform 800ms ease;
      }

      .plate {
        position: absolute;
        left: 4%;
        right: 4%;
        bottom: 0;
        height: 2.1rem;
        border-radius: 50%;
        background: linear-gradient(#ffffff, var(--plate));
        box-shadow: inset 0 -0.4rem 0 rgba(89, 154, 180, 0.18);
      }

      .cake-base {
        position: absolute;
        left: 12%;
        right: 12%;
        bottom: 1.2rem;
        height: 8.3rem;
        border-radius: 1rem 1rem 1.6rem 1.6rem;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 35%, rgba(255, 255, 255, 0.28) 0 0.75rem, transparent 0.8rem),
          radial-gradient(circle at 72% 58%, rgba(255, 255, 255, 0.25) 0 0.7rem, transparent 0.76rem),
          linear-gradient(90deg, var(--cake-dark), var(--cake) 18% 82%, var(--cake-dark));
      }

      .cake-base::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 2rem;
        background: var(--frosting);
        border-radius: 0 0 45% 45%;
        box-shadow:
          2.3rem 1.15rem 0 -0.25rem var(--frosting),
          6rem 0.9rem 0 -0.1rem var(--frosting),
          10rem 1.25rem 0 -0.25rem var(--frosting),
          14rem 0.85rem 0 -0.15rem var(--frosting),
          18rem 1.25rem 0 -0.3rem var(--frosting);
      }

      .cake-base::after {
        content: "";
        position: absolute;
        inset: 52% 0 auto;
        height: 0.55rem;
        background: rgba(255, 249, 237, 0.48);
      }

      .top-layer {
        position: absolute;
        left: 21%;
        right: 21%;
        bottom: 8.5rem;
        height: 3.7rem;
        border-radius: 1rem 1rem 0.75rem 0.75rem;
        background: linear-gradient(90deg, #d98aa5, var(--cream) 12% 88%, #d98aa5);
      }

      .top-layer::before {
        content: "";
        position: absolute;
        inset: -0.75rem -0.15rem auto;
        height: 1.45rem;
        border-radius: 50%;
        background: linear-gradient(#fff9ea, var(--cream));
      }

      .candles {
        position: absolute;
        left: 26%;
        right: 26%;
        bottom: 11.65rem;
        height: 4rem;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }

      .candle {
        width: 0.8rem;
        height: 3.2rem;
        border-radius: 0.25rem;
        position: relative;
        background: repeating-linear-gradient(-35deg, #ffffff 0 0.32rem, #88e0ff 0.34rem 0.68rem);
        box-shadow: inset -0.15rem 0 0 rgba(0, 0, 0, 0.08);
      }

      .candle:nth-child(2) {
        height: 3.8rem;
        background: repeating-linear-gradient(-35deg, #ffffff 0 0.32rem, #ff8fb7 0.34rem 0.68rem);
      }

      .candle:nth-child(3) {
        background: repeating-linear-gradient(-35deg, #ffffff 0 0.32rem, #ffd76d 0.34rem 0.68rem);
      }

      .flame {
        position: absolute;
        left: 50%;
        top: -1.45rem;
        width: 1rem;
        height: 1.45rem;
        transform: translateX(-50%) rotate(7deg);
        border-radius: 50% 50% 50% 12%;
        background: radial-gradient(circle at 55% 65%, var(--flame-core) 0 27%, transparent 29%), var(--flame);
        box-shadow: 0 0 1rem rgba(255, 220, 105, 0.95), 0 0 2rem rgba(255, 143, 183, 0.65);
        animation: flicker 360ms infinite alternate ease-in-out;
        transform-origin: 50% 100%;
        transition: opacity 260ms ease, transform 260ms ease;
      }

      .candle:nth-child(2) .flame {
        animation-delay: -120ms;
      }

      .candle:nth-child(3) .flame {
        animation-delay: -240ms;
      }

      .controls {
        margin-top: 2rem;
        display: grid;
        justify-items: center;
        gap: 0.9rem;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 1rem 1.35rem;
        color: #39102c;
        background: linear-gradient(135deg, #fff3a8, #ffb9d0);
        box-shadow: 0 0.8rem 1.4rem rgba(0, 0, 0, 0.2);
        cursor: pointer;
        font: inherit;
        font-weight: 900;
        letter-spacing: -0.01em;
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      button:hover,
      button:focus-visible {
        transform: translateY(-0.12rem);
        box-shadow: 0 1rem 1.7rem rgba(0, 0, 0, 0.26);
      }

      button:focus-visible {
        outline: 0.2rem solid white;
        outline-offset: 0.25rem;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.78;
        transform: none;
      }

      .status {
        min-height: 1.5rem;
        margin: 0;
        color: var(--muted);
        font-weight: 700;
      }

      .meter {
        width: min(18rem, 70vw);
        height: 0.7rem;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
      }

      .meter span {
        display: block;
        width: calc(var(--level, 0) * 100%);
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #8be7ff, #fff3a8, #ff8fb7);
        transition: width 80ms linear;
      }

      .confetti {
        position: fixed;
        top: -1rem;
        width: 0.65rem;
        height: 1rem;
        border-radius: 0.16rem;
        opacity: 0;
        pointer-events: none;
        animation: fall 2.6s linear forwards;
      }

      .revealed .message {
        opacity: 1;
        transform: translate(-50%, -0.25rem) scale(1);
      }

      .revealed .cake {
        transform: translateY(2.2rem) scale(0.94);
      }

      .revealed .flame {
        opacity: 0;
        transform: translateX(-50%) translateY(0.5rem) scale(0.1) rotate(55deg);
        animation-play-state: paused;
      }

      @keyframes flicker {
        from {
          transform: translateX(-50%) rotate(-8deg) scale(0.94, 1.04);
        }
        to {
          transform: translateX(-50%) rotate(9deg) scale(1.08, 0.94);
        }
      }

      @keyframes fall {
        0% {
          opacity: 1;
          transform: translate3d(0, 0, 0) rotate(0deg);
        }
        100% {
          opacity: 0;
          transform: translate3d(var(--drift), 105vh, 0) rotate(680deg);
        }
      }

      @media (max-width: 34rem) {
        .gift-card {
          border-radius: 1.35rem;
        }

        .stage {
          min-height: 18rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="gift-card" aria-labelledby="page-title">
        <p class="eyebrow">A tiny domain-shaped gift</p>
        <h1 id="page-title">st.gy is yours</h1>
        <p class="intro">Tap the button to give the page microphone permission, then blow on your phone to put out the candles.</p>

        <div class="stage" id="stage">
          <p class="message" aria-live="polite">Merry Unbirthday!</p>

          <div class="cake" role="img" aria-label="A pink cake with three lit candles">
            <div class="candles" aria-hidden="true">
              <div class="candle"><span class="flame"></span></div>
              <div class="candle"><span class="flame"></span></div>
              <div class="candle"><span class="flame"></span></div>
            </div>
            <div class="top-layer"></div>
            <div class="cake-base"></div>
            <div class="plate"></div>
          </div>
        </div>

        <div class="controls">
          <button id="start-button" type="button">Use microphone and make a wish</button>
          <p class="status" id="status">Microphone access is required for the candles.</p>
          <div class="meter" aria-hidden="true"><span id="meter-fill"></span></div>
        </div>
      </section>
    </main>

    <script>
      const stage = document.querySelector('#stage');
      const startButton = document.querySelector('#start-button');
      const statusText = document.querySelector('#status');
      const meterFill = document.querySelector('#meter-fill');

      let audioContext;
      let analyser;
      let microphoneStream;
      let animationFrame;
      let blowFrames = 0;
      let lit = true;

      const setStatus = (message) => {
        statusText.textContent = message;
      };

      const celebrate = () => {
        for (let i = 0; i < 80; i += 1) {
          const confetti = document.createElement('span');
          confetti.className = 'confetti';
          confetti.style.left = `${Math.random() * 100}vw`;
          confetti.style.background = ['#fff3a8', '#ff8fb7', '#8be7ff', '#c8ffb8'][i % 4];
          confetti.style.setProperty('--drift', `${(Math.random() - 0.5) * 16}rem`);
          confetti.style.animationDelay = `${Math.random() * 0.6}s`;
          document.body.append(confetti);
          confetti.addEventListener('animationend', () => confetti.remove(), { once: true });
        }
      };

      const extinguishCandles = () => {
        if (!lit) return;
        lit = false;
        stage.classList.add('revealed');
        startButton.hidden = true;
        setStatus('The candles are out. The gift is revealed.');
        celebrate();

        if (animationFrame) cancelAnimationFrame(animationFrame);
        if (microphoneStream) {
          microphoneStream.getTracks().forEach((track) => track.stop());
        }
        if (audioContext && audioContext.state !== 'closed') {
          audioContext.close();
        }
      };

      const listenForBlow = () => {
        const samples = new Uint8Array(analyser.fftSize);

        const tick = () => {
          analyser.getByteTimeDomainData(samples);

          let sum = 0;
          for (const sample of samples) {
            const centered = (sample - 128) / 128;
            sum += centered * centered;
          }

          const volume = Math.sqrt(sum / samples.length);
          const level = Math.min(1, volume * 8);
          meterFill.style.setProperty('--level', level.toFixed(3));

          if (volume > 0.16) {
            blowFrames += 1;
          } else {
            blowFrames = Math.max(0, blowFrames - 1);
          }

          if (blowFrames > 5) {
            extinguishCandles();
            return;
          }

          animationFrame = requestAnimationFrame(tick);
        };

        animationFrame = requestAnimationFrame(tick);
      };

      startButton.addEventListener('click', async () => {
        startButton.disabled = true;
        setStatus('Waiting for microphone permission...');

        try {
          microphoneStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) {
            throw new Error('Web Audio is not supported in this browser.');
          }

          audioContext = new AudioContextClass();
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 1024;

          const source = audioContext.createMediaStreamSource(microphoneStream);
          source.connect(analyser);

          startButton.textContent = 'Listening for a blow...';
          setStatus('Now blow on your phone to put out the candles.');
          listenForBlow();
        } catch (error) {
          startButton.disabled = false;
          setStatus('Microphone permission is required. Please allow it to blow out the candles.');
        }
      });
    </script>
  </body>
</html>
